onboarding = false

[ui.toast]
delivery = "terminal"

[ui.sound]
# Play sounds when agents change state in background workspaces.
enabled = false

[ui]
prompt_new_tab_name = false
sidebar_width = 26
sidebar_max_width = 32

agent_panel_sort = "spaces"
[keys]
prefix = "ctrl+a"

[keys.indexed]
# Meta+1..9 focuses tabs directly.
tabs = "alt"
# Meta+Shift+1..9 focuses agent rows directly.
agents = "alt+shift"

[theme]
name = "gruvbox"
auto_switch = false

[terminal]
# Executable used for new interactive panes.
default_shell = "/usr/local/bin/fish"

[experimental]
kitty_graphics = true
